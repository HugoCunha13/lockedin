<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LockedIn - Criar Conta</title>
  <link rel="stylesheet" href="/css/register.css" />
</head>
<body>

  <div class="bg"></div>

  <div class="card">

    <div class="logo-circle">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="32" height="32">
        <path d="M12 1C9.24 1 7 3.24 7 6v1H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1h-2V6c0-2.76-2.24-5-5-5zm0 2c1.66 0 3 1.34 3 3v1H9V6c0-1.66 1.34-3 3-3zm0 9a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/>
      </svg>
    </div>

    <h1>Criar conta</h1>
    <p class="subtitle">Começa a tua jornada com o LockedIn</p>

    <form id="registerForm">

      <div class="input-group">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <input type="text" id="nome" placeholder="Nome completo" required />
      </div>

      <div class="input-group">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M2 7l10 7 10-7"/>
          </svg>
        </span>
        <input type="email" id="email" placeholder="E-mail" required />
      </div>

      <div class="input-group">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="password" placeholder="Palavra-passe" required />
      </div>

      <div class="input-group">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <input type="password" id="confirmPassword" placeholder="Confirmar palavra-passe" required />
      </div>

      <div class="terms">
        <label class="remember">
          <input type="checkbox" required /> Aceito os <a href="#">termos e condições</a>
        </label>
      </div>

      <button type="submit" class="btn-criar">Criar conta</button>

    </form>

    <div class="divider"><span>ou</span></div>

    <button class="btn-social">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.19 3.22l6.85-6.85C35.64 2.37 30.18 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.97 6.19C12.43 13.08 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.55c0-1.64-.15-3.22-.42-4.74H24v8.97h12.42c-.54 2.9-2.17 5.36-4.63 7.01l7.19 5.59C43.18 37.07 46.1 31.27 46.1 24.55z"/>
        <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.5 24c0-1.6.28-3.15.77-4.59l-7.97-6.19A23.93 23.93 0 0 0 0 24c0 3.87.92 7.53 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.18 0 11.36-2.05 15.14-5.57l-7.19-5.59c-2.01 1.35-4.59 2.16-7.95 2.16-6.26 0-11.57-3.58-13.47-8.91l-7.97 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Registar com <strong>Google</strong>
    </button>

    <button class="btn-social">
      <svg width="18" height="18" viewBox="0 0 814 1000" fill="currentColor">
        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-47.4-148.2-116.1C46.6 672 0 580.8 0 494.3c0-74.9 26-143 74.9-192.9 44.5-45.9 105-73.7 170.6-73.7 68 0 110.3 42.1 149.1 42.1 37.3 0 86.3-44.5 162.8-44.5 26.7 0 109.1 2.6 165.3 78.7zM539.4 75.6c30.6-36.2 52.5-86.9 52.5-137.6 0-7.1-.6-14.3-1.9-20.1-49.9 1.9-109.1 33.2-145.1 74.3-28 31.9-54.5 82.6-54.5 134 0 7.7 1.3 15.5 1.9 17.9 3.2.6 8.4 1.3 13.6 1.3 44.5 0 100.6-29.9 133.5-69.8z"/>
      </svg>
      Registar com <strong>Apple</strong>
    </button>

    <p class="login-link">
      Já tens conta? <a href="login.html">Entrar ›</a>
    </p>

  </div>

  <script type="module" src="/js/views/registerView.js"></script>
</body>
</html>
